# Not active here: GitHub only runs workflows in .github/workflows/. Never executed.
#
# Once a day: ask CloudFormation whether production still matches its template.
# Detection only. It never reverts or accepts anything.
name: drift

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 Asia/Tokyo, away from the top of the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        stage: [prod]
    env:
      AIH_AWS_ACCOUNT_ID: ${{ vars.AIH_AWS_ACCOUNT_ID }}
      AIH_AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop --command vp install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AIH_DRIFT_ROLE_ARN }} # output DriftRoleArn of AihShipCi
          aws-region: ap-northeast-1
          allowed-account-ids: ${{ vars.AIH_AWS_ACCOUNT_ID }}
      - name: Detect drift
        # Exit codes: 0 clean (or only acknowledged gaps), 10 drifted or deleted,
        # 11 some resources not compared, 12 detection failed or timed out.
        run: nix develop --command vp run ship:cfn:drift -c stage=${{ matrix.stage }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-${{ matrix.stage }}
          path: reports/drift/
          if-no-files-found: warn
