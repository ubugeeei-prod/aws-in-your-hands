# Not active here: GitHub only runs workflows in .github/workflows/. Never executed.
#
# Every push to main: deploy production through the CDK CLI and CloudFormation,
# then call the API. Changes AWS.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ship-deploy-prod
  cancel-in-progress: false # a cancelled deploy leaves the stack mid-operation

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The role trusts this environment, not the branch. Restrict the environment to main in its settings.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AIH_AWS_ACCOUNT_ID: ${{ vars.AIH_AWS_ACCOUNT_ID }}
      AIH_AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop --command vp install --frozen-lockfile
      - run: nix develop --command vp run check:all
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AIH_DEPLOY_ROLE_ARN }} # output DeployRoleArn of AihShipCi
          aws-region: ap-northeast-1
          allowed-account-ids: ${{ vars.AIH_AWS_ACCOUNT_ID }}
      - name: Refuse to deploy onto a stack that needs repair
        run: nix develop --command vp run ship:cfn:status -c stage=prod
      - name: Deploy
        run: nix develop --command vp run ship:cfn:deploy -c stage=prod
      - name: Call the deployed API
        run: nix develop --command vp run ship:smoke -c stage=prod
      - name: Where did it stop
        if: failure()
        run: nix develop --command vp run ship:cfn:status -c stage=prod
