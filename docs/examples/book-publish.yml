# Example only. Not executed; see README.md in this directory.
#
# Publishes the book's content to the bucket that `vp run book:infra:deploy`
# created, then checks what readers actually receive. It does not create or
# change infrastructure.
name: publish book

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: book-publish # two publishes at once would interleave their upload phases
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AIH_AWS_ACCOUNT_ID: ${{ vars.AIH_AWS_ACCOUNT_ID }}
      AIH_AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AIH_BOOK_PUBLISH_ROLE_ARN }} # not defined in this repository
          aws-region: ap-northeast-1
      - run: nix develop --command vp install --frozen-lockfile
      - run: nix develop --command vp run check:all
      - run: nix develop --command vp run book:publish
      - run: nix develop --command vp run book:smoke
