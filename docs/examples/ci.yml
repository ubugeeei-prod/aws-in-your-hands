# Example only. Not executed; see README.md in this directory.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-all:
    runs-on: ubuntu-latest # x86_64-linux: the Nix expressions exist for it but are unverified
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install dependencies exactly as locked
        run: nix develop --command vp install --frozen-lockfile
      - name: Run every check that needs no AWS
        run: nix develop --command vp run check:all
